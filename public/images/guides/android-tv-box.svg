<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Android TV box connected to a television">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.55" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="1" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgA)" />
  <circle cx="240" cy="120" r="260" fill="url(#glowA)" />
  <circle cx="980" cy="540" r="240" fill="url(#glowA)" opacity="0.6" />

  <!-- television -->
  <rect x="250" y="120" width="700" height="400" rx="26" fill="#020617" stroke="#334155" stroke-width="6" />
  <rect x="282" y="152" width="636" height="336" rx="14" fill="#0b1220" />
  <rect x="282" y="152" width="636" height="336" rx="14" fill="url(#screenA)" opacity="0.14" />

  <!-- channel grid on screen -->
  <g fill="#f8fafc" opacity="0.9">
    <rect x="312" y="186" width="150" height="14" rx="7" opacity="0.55" />
    <rect x="312" y="222" width="252" height="86" rx="12" fill="url(#screenA)" />
    <rect x="580" y="222" width="150" height="86" rx="12" opacity="0.16" />
    <rect x="746" y="222" width="150" height="86" rx="12" opacity="0.16" />
    <rect x="312" y="332" width="150" height="86" rx="12" opacity="0.16" />
    <rect x="478" y="332" width="150" height="86" rx="12" opacity="0.16" />
    <rect x="644" y="332" width="150" height="86" rx="12" opacity="0.16" />
    <rect x="810" y="332" width="86" height="86" rx="12" opacity="0.16" />
    <rect x="312" y="440" width="330" height="12" rx="6" opacity="0.3" />
  </g>

  <!-- play glyph -->
  <path d="M406 250l58 36-58 36z" fill="#0f172a" />

  <!-- stand -->
  <rect x="540" y="520" width="120" height="16" rx="8" fill="#334155" />
  <rect x="470" y="536" width="260" height="14" rx="7" fill="#1e293b" />

  <!-- android box -->
  <rect x="120" y="452" width="190" height="96" rx="18" fill="#111827" stroke="#f97316" stroke-width="4" />
  <circle cx="160" cy="500" r="10" fill="#22c55e" />
  <rect x="188" y="486" width="94" height="10" rx="5" fill="#475569" />
  <rect x="188" y="506" width="64" height="10" rx="5" fill="#475569" />

  <!-- ethernet cable -->
  <path d="M310 500C400 500 420 470 470 470" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- remote -->
  <rect x="1000" y="300" width="84" height="248" rx="34" fill="#111827" stroke="#334155" stroke-width="4" />
  <circle cx="1042" cy="360" r="20" fill="#f97316" />
  <rect x="1022" y="400" width="40" height="10" rx="5" fill="#475569" />
  <rect x="1022" y="426" width="40" height="10" rx="5" fill="#475569" />
  <rect x="1022" y="452" width="40" height="10" rx="5" fill="#475569" />
  <rect x="1022" y="478" width="40" height="10" rx="5" fill="#475569" />
</svg>
