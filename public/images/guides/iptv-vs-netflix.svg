<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="IPTV live channels compared with on demand streaming">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="leftD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="rightD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgD)" />

  <!-- left panel: live tv -->
  <g>
    <rect x="70" y="110" width="470" height="410" rx="26" fill="#111827" stroke="#f97316" stroke-width="4" opacity="0.95" />
    <rect x="106" y="150" width="398" height="176" rx="14" fill="url(#leftD)" opacity="0.22" />
    <rect x="106" y="150" width="398" height="176" rx="14" fill="none" stroke="#f97316" stroke-width="2" opacity="0.5" />

    <!-- live badge -->
    <rect x="130" y="176" width="90" height="30" rx="15" fill="#ef4444" />
    <circle cx="150" cy="191" r="6" fill="#fff" />
    <text x="180" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">LIVE</text>

    <path d="M286 232l44 30-44 30z" fill="#f97316" />

    <!-- epg rows -->
    <rect x="106" y="352" width="120" height="12" rx="6" fill="#f8fafc" opacity="0.5" />
    <rect x="106" y="384" width="398" height="34" rx="8" fill="#f8fafc" opacity="0.1" />
    <rect x="106" y="384" width="150" height="34" rx="8" fill="#f97316" opacity="0.7" />
    <rect x="106" y="428" width="398" height="34" rx="8" fill="#f8fafc" opacity="0.1" />
    <rect x="106" y="428" width="240" height="34" rx="8" fill="#f97316" opacity="0.45" />
    <rect x="106" y="472" width="398" height="34" rx="8" fill="#f8fafc" opacity="0.1" />
    <rect x="106" y="472" width="96" height="34" rx="8" fill="#f97316" opacity="0.3" />
  </g>

  <!-- right panel: on demand -->
  <g>
    <rect x="660" y="110" width="470" height="410" rx="26" fill="#111827" stroke="#e11d48" stroke-width="4" opacity="0.95" />
    <rect x="696" y="150" width="118" height="170" rx="12" fill="url(#rightD)" opacity="0.85" />
    <rect x="832" y="150" width="118" height="170" rx="12" fill="url(#rightD)" opacity="0.55" />
    <rect x="968" y="150" width="118" height="170" rx="12" fill="url(#rightD)" opacity="0.35" />

    <rect x="696" y="352" width="150" height="12" rx="6" fill="#f8fafc" opacity="0.5" />
    <rect x="696" y="384" width="118" height="122" rx="12" fill="#f8fafc" opacity="0.12" />
    <rect x="832" y="384" width="118" height="122" rx="12" fill="#f8fafc" opacity="0.12" />
    <rect x="968" y="384" width="118" height="122" rx="12" fill="#f8fafc" opacity="0.12" />
    <path d="M742 428l32 22-32 22z" fill="#f8fafc" opacity="0.6" />
  </g>

  <!-- vs badge -->
  <circle cx="600" cy="315" r="66" fill="#0f172a" stroke="#f8fafc" stroke-width="5" />
  <text x="600" y="336" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#f8fafc" text-anchor="middle">VS</text>

  <text x="305" y="562" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#f97316" text-anchor="middle" letter-spacing="3">LIVE CHANNELS</text>
  <text x="895" y="562" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fb7185" text-anchor="middle" letter-spacing="3">ON DEMAND</text>
</svg>
