<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A live stream stalling on a buffering wheel next to a network diagnostic panel">
  <defs>
    <linearGradient id="bgB1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="scB1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glB1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.32"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgB1)"/>
  <circle cx="290" cy="120" r="270" fill="url(#glB1)"/>
  <circle cx="960" cy="530" r="240" fill="url(#glB1)" opacity="0.5"/>

  <!-- screen -->
  <rect x="170" y="86" width="620" height="400" rx="20" fill="#020617" stroke="#334155" stroke-width="5"/>
  <rect x="196" y="112" width="568" height="348" rx="10" fill="#0b1220"/>
  <!-- buffering ring -->
  <circle cx="480" cy="286" r="72" fill="none" stroke="#1e293b" stroke-width="14"/>
  <path d="M480 214 a72 72 0 0 1 62 36" fill="none" stroke="url(#scB1)" stroke-width="14" stroke-linecap="round"/>
  <rect x="386" y="386" width="188" height="14" rx="7" fill="#334155"/>
  <rect x="422" y="412" width="116" height="10" rx="5" fill="#1e293b"/>

  <!-- diagnostic panel -->
  <rect x="828" y="120" width="242" height="332" rx="16" fill="#111c2e" stroke="#1e293b" stroke-width="3"/>
  <rect x="852" y="148" width="120" height="14" rx="6" fill="#475569"/>

  <g>
    <rect x="852" y="186" width="194" height="42" rx="8" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <circle cx="874" cy="207" r="7" fill="#34d399"/>
    <rect x="892" y="201" width="94" height="11" rx="5" fill="#334155"/>

    <rect x="852" y="238" width="194" height="42" rx="8" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <circle cx="874" cy="259" r="7" fill="#34d399"/>
    <rect x="892" y="253" width="122" height="11" rx="5" fill="#334155"/>

    <rect x="852" y="290" width="194" height="42" rx="8" fill="#1c1a12" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="874" cy="311" r="7" fill="#f59e0b"/>
    <rect x="892" y="305" width="80" height="11" rx="5" fill="#94a3b8"/>

    <rect x="852" y="342" width="194" height="42" rx="8" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <circle cx="874" cy="363" r="7" fill="#64748b"/>
    <rect x="892" y="357" width="106" height="11" rx="5" fill="#334155"/>
  </g>

  <!-- signal bars -->
  <g>
    <rect x="852" y="404" width="18" height="14" rx="3" fill="url(#scB1)"/>
    <rect x="878" y="396" width="18" height="22" rx="3" fill="url(#scB1)"/>
    <rect x="904" y="386" width="18" height="32" rx="3" fill="#334155"/>
    <rect x="930" y="376" width="18" height="42" rx="3" fill="#1e293b"/>
  </g>

  <!-- stand -->
  <rect x="420" y="486" width="120" height="14" rx="6" fill="#1e293b"/>
  <rect x="330" y="500" width="300" height="16" rx="8" fill="#334155"/>

</svg>
