<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="iPhone streaming IPTV and casting to a television">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.5" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="1" stop-color="#fb7185" />
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgB)" />
  <circle cx="900" cy="140" r="280" fill="url(#glowB)" />
  <circle cx="200" cy="520" r="240" fill="url(#glowB)" opacity="0.5" />

  <!-- phone -->
  <rect x="150" y="90" width="300" height="470" rx="46" fill="#020617" stroke="#334155" stroke-width="7" />
  <rect x="170" y="110" width="260" height="430" rx="32" fill="#0b1220" />
  <rect x="256" y="118" width="88" height="16" rx="8" fill="#020617" />

  <g>
    <rect x="190" y="152" width="220" height="118" rx="14" fill="url(#screenB)" />
    <path d="M276 192l40 26-40 26z" fill="#0f172a" />
    <rect x="190" y="288" width="130" height="12" rx="6" fill="#f8fafc" opacity="0.55" />
    <rect x="190" y="318" width="104" height="60" rx="10" fill="#f8fafc" opacity="0.14" />
    <rect x="306" y="318" width="104" height="60" rx="10" fill="#f8fafc" opacity="0.14" />
    <rect x="190" y="392" width="104" height="60" rx="10" fill="#f8fafc" opacity="0.14" />
    <rect x="306" y="392" width="104" height="60" rx="10" fill="#f8fafc" opacity="0.14" />
    <rect x="190" y="470" width="220" height="12" rx="6" fill="#f8fafc" opacity="0.28" />
    <rect x="190" y="498" width="150" height="12" rx="6" fill="#f8fafc" opacity="0.18" />
  </g>

  <!-- airplay waves -->
  <g stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M498 316a70 70 0 0 1 0-98" />
    <path d="M544 348a120 120 0 0 0 0-162" opacity="0.65" />
    <path d="M590 380a170 170 0 0 0 0-226" opacity="0.45" />
  </g>

  <!-- television -->
  <rect x="640" y="150" width="440" height="270" rx="22" fill="#020617" stroke="#334155" stroke-width="6" />
  <rect x="666" y="176" width="388" height="218" rx="12" fill="#0b1220" />
  <rect x="666" y="176" width="388" height="218" rx="12" fill="url(#screenB)" opacity="0.16" />
  <path d="M838 250l52 34-52 34z" fill="#f97316" />
  <rect x="810" y="420" width="100" height="14" rx="7" fill="#334155" />
  <rect x="750" y="434" width="220" height="12" rx="6" fill="#1e293b" />

  <!-- airplay glyph badge -->
  <g transform="translate(1010 470)">
    <rect x="-46" y="-38" width="92" height="76" rx="20" fill="#111827" stroke="#38bdf8" stroke-width="3" />
    <rect x="-28" y="-22" width="56" height="34" rx="6" fill="none" stroke="#38bdf8" stroke-width="4" />
    <path d="M0 14l18 18h-36z" fill="#38bdf8" />
  </g>
</svg>
