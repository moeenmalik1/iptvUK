<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="MacBook playing live IPTV and streaming to a television over AirPlay">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="scM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="alM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="glM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.38"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgM)"/>
  <circle cx="270" cy="150" r="270" fill="url(#glM)"/>
  <circle cx="950" cy="510" r="230" fill="url(#glM)" opacity="0.55"/>

  <!-- macbook -->
  <rect x="110" y="140" width="520" height="330" rx="18" fill="#0b1220" stroke="url(#alM)" stroke-width="6"/>
  <rect x="134" y="164" width="472" height="282" rx="8" fill="#020617"/>
  <rect x="134" y="164" width="472" height="282" rx="8" fill="url(#scM)" opacity="0.1"/>
  <circle cx="370" cy="152" r="3" fill="#475569"/>

  <rect x="160" y="190" width="150" height="12" rx="6" fill="#f8fafc" opacity="0.45"/>
  <rect x="160" y="216" width="290" height="150" rx="10" fill="url(#scM)"/>
  <path d="M288 268l42 26-42 26z" fill="#0f172a"/>
  <rect x="466" y="216" width="114" height="70" rx="9" fill="#f8fafc" opacity="0.14"/>
  <rect x="466" y="296" width="114" height="70" rx="9" fill="#f8fafc" opacity="0.14"/>
  <rect x="160" y="386" width="420" height="12" rx="6" fill="#f8fafc" opacity="0.28"/>
  <rect x="160" y="410" width="240" height="12" rx="6" fill="#f97316" opacity="0.7"/>

  <!-- live badge -->
  <rect x="184" y="238" width="86" height="28" rx="14" fill="#ef4444"/>
  <circle cx="203" cy="252" r="6" fill="#fff"/>
  <text x="232" y="258" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">LIVE</text>

  <!-- base -->
  <path d="M70 470h600l34 42H36z" fill="url(#alM)" opacity="0.85"/>
  <rect x="320" y="484" width="100" height="10" rx="5" fill="#64748b"/>

  <!-- airplay waves -->
  <g stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M676 330a70 70 0 0 0 0-98"/>
    <path d="M714 362a120 120 0 0 0 0-162" opacity="0.6"/>
    <path d="M752 394a170 170 0 0 0 0-226" opacity="0.4"/>
  </g>

  <!-- tv -->
  <rect x="790" y="140" width="330" height="220" rx="18" fill="#020617" stroke="#334155" stroke-width="6"/>
  <rect x="812" y="162" width="286" height="176" rx="10" fill="#0b1220"/>
  <rect x="812" y="162" width="286" height="176" rx="10" fill="url(#scM)" opacity="0.16"/>
  <path d="M938 224l40 26-40 26z" fill="#f97316"/>
  <rect x="920" y="360" width="70" height="14" rx="7" fill="#334155"/>
  <rect x="875" y="374" width="160" height="12" rx="6" fill="#1e293b"/>

  <!-- airplay glyph -->
  <g transform="translate(1060 470)">
    <rect x="-46" y="-38" width="92" height="76" rx="20" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
    <rect x="-28" y="-22" width="56" height="34" rx="6" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <path d="M0 14l18 18h-36z" fill="#38bdf8"/>
  </g>
</svg>
