<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Android TV home screen with live channels and a programme guide">
  <defs>
    <linearGradient id="bgA2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="scA2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glA2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgA2)"/>
  <circle cx="300" cy="130" r="260" fill="url(#glA2)"/>
  <circle cx="960" cy="520" r="240" fill="url(#glA2)" opacity="0.55"/>

  <!-- tv -->
  <rect x="200" y="80" width="740" height="430" rx="26" fill="#020617" stroke="#334155" stroke-width="6"/>
  <rect x="232" y="112" width="676" height="366" rx="14" fill="#0b1220"/>

  <!-- top row: featured -->
  <rect x="264" y="146" width="300" height="160" rx="12" fill="url(#scA2)"/>
  <path d="M392 200l48 30-48 30z" fill="#0f172a"/>
  <rect x="586" y="146" width="150" height="160" rx="12" fill="#f8fafc" opacity="0.14"/>
  <rect x="756" y="146" width="120" height="160" rx="12" fill="#f8fafc" opacity="0.14"/>

  <!-- epg rows -->
  <rect x="264" y="330" width="120" height="12" rx="6" fill="#f8fafc" opacity="0.45"/>
  <rect x="264" y="358" width="612" height="32" rx="8" fill="#f8fafc" opacity="0.08"/>
  <rect x="264" y="358" width="190" height="32" rx="8" fill="#f97316" opacity="0.75"/>
  <rect x="264" y="400" width="612" height="32" rx="8" fill="#f8fafc" opacity="0.08"/>
  <rect x="264" y="400" width="300" height="32" rx="8" fill="#f97316" opacity="0.45"/>
  <rect x="264" y="442" width="612" height="26" rx="8" fill="#f8fafc" opacity="0.08"/>
  <rect x="264" y="442" width="110" height="26" rx="8" fill="#f97316" opacity="0.3"/>

  <!-- live badge -->
  <rect x="288" y="170" width="88" height="28" rx="14" fill="#ef4444"/>
  <circle cx="307" cy="184" r="6" fill="#fff"/>
  <text x="336" y="190" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">LIVE</text>

  <!-- stand -->
  <rect x="510" y="510" width="120" height="16" rx="8" fill="#334155"/>
  <rect x="440" y="526" width="260" height="14" rx="7" fill="#1e293b"/>

  <!-- android box -->
  <rect x="960" y="420" width="180" height="90" rx="16" fill="#111827" stroke="#22c55e" stroke-width="4"/>
  <circle cx="996" cy="465" r="9" fill="#22c55e"/>
  <rect x="1022" y="452" width="90" height="9" rx="4.5" fill="#475569"/>
  <rect x="1022" y="470" width="60" height="9" rx="4.5" fill="#475569"/>

  <!-- remote -->
  <rect x="70" y="330" width="86" height="240" rx="34" fill="#111827" stroke="#334155" stroke-width="4"/>
  <circle cx="113" cy="392" r="26" fill="none" stroke="#f97316" stroke-width="6"/>
  <circle cx="113" cy="392" r="10" fill="#f97316"/>
  <rect x="93" y="442" width="40" height="10" rx="5" fill="#475569"/>
  <rect x="93" y="470" width="40" height="10" rx="5" fill="#475569"/>
  <rect x="93" y="498" width="40" height="10" rx="5" fill="#475569"/>
</svg>
