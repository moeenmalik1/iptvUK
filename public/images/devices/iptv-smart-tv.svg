<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Samsung and LG Smart TV showing an IPTV channel list and programme guide">
  <defs>
    <linearGradient id="bgS1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="scS1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glS1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgS1)"/>
  <circle cx="280" cy="120" r="270" fill="url(#glS1)"/>
  <circle cx="980" cy="530" r="230" fill="url(#glS1)" opacity="0.5"/>

  <!-- wall-mounted panel -->
  <rect x="150" y="70" width="900" height="450" rx="14" fill="#020617" stroke="#334155" stroke-width="5"/>
  <rect x="168" y="88" width="864" height="414" rx="6" fill="#0b1220"/>

  <!-- guide header -->
  <rect x="196" y="118" width="200" height="26" rx="6" fill="url(#scS1)"/>
  <rect x="412" y="122" width="120" height="18" rx="6" fill="#1e293b"/>
  <rect x="548" y="122" width="96" height="18" rx="6" fill="#1e293b"/>
  <rect x="900" y="118" width="104" height="26" rx="13" fill="#0f766e" opacity="0.5"/>
  <circle cx="920" cy="131" r="5" fill="#34d399"/>

  <!-- featured tile -->
  <rect x="196" y="168" width="380" height="196" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="2"/>
  <circle cx="386" cy="252" r="34" fill="url(#scS1)" opacity="0.9"/>
  <path d="M376 238 l24 14 -24 14 z" fill="#0b1220"/>
  <rect x="220" y="310" width="220" height="14" rx="5" fill="#334155"/>
  <rect x="220" y="334" width="150" height="12" rx="5" fill="#1e293b"/>

  <!-- channel rows -->
  <g>
    <rect x="600" y="168" width="404" height="42" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="2"/>
    <rect x="616" y="181" width="16" height="16" rx="4" fill="url(#scS1)"/>
    <rect x="646" y="183" width="150" height="12" rx="5" fill="#334155"/>
    <rect x="944" y="183" width="44" height="12" rx="6" fill="#1e293b"/>

    <rect x="600" y="220" width="404" height="42" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="2"/>
    <rect x="616" y="233" width="16" height="16" rx="4" fill="#38bdf8"/>
    <rect x="646" y="235" width="186" height="12" rx="5" fill="#334155"/>
    <rect x="944" y="235" width="44" height="12" rx="6" fill="#1e293b"/>

    <rect x="600" y="272" width="404" height="42" rx="8" fill="#16243a" stroke="#f97316" stroke-width="2"/>
    <rect x="616" y="285" width="16" height="16" rx="4" fill="url(#scS1)"/>
    <rect x="646" y="287" width="132" height="12" rx="5" fill="#94a3b8"/>
    <rect x="944" y="287" width="44" height="12" rx="6" fill="#f97316" opacity="0.7"/>

    <rect x="600" y="324" width="404" height="42" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="2"/>
    <rect x="616" y="337" width="16" height="16" rx="4" fill="#a78bfa"/>
    <rect x="646" y="339" width="168" height="12" rx="5" fill="#334155"/>
    <rect x="944" y="339" width="44" height="12" rx="6" fill="#1e293b"/>
  </g>

  <!-- category chips -->
  <g>
    <rect x="196" y="392" width="104" height="30" rx="15" fill="#1e293b"/>
    <rect x="312" y="392" width="120" height="30" rx="15" fill="#1e293b"/>
    <rect x="444" y="392" width="92" height="30" rx="15" fill="#1e293b"/>
    <rect x="548" y="392" width="132" height="30" rx="15" fill="#1e293b"/>
    <rect x="692" y="392" width="100" height="30" rx="15" fill="#1e293b"/>
  </g>

  <!-- bezel badge -->
  <rect x="196" y="446" width="150" height="30" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect x="212" y="456" width="118" height="10" rx="5" fill="#475569"/>

  <!-- stand -->
  <rect x="540" y="520" width="120" height="14" rx="6" fill="#1e293b"/>
  <rect x="450" y="534" width="300" height="16" rx="8" fill="#334155"/>
</svg>
